controller_manager:
  ros__parameters:
    update_rate: 250

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    # New controller for custom PID effort commands
    leg_effort_controller:
      type: velocity_controllers/JointGroupVelocityController

leg_effort_controller:
  ros__parameters:
    joints:
      - Left_Hip_joint
      - Left_Knee_joint
      - Right_Hip_Joint
      - Right_Knee_joint